[package]
name = "openremote-agent"
version = "0.8.0"
edition = "2021"
rust-version = "1.89"
license = "LicenseRef-Proprietary"

[dependencies]
anyhow = "1.0"
base64 = "0.22"
bytes = "1.10"
ed25519-dalek = { version = "2.2", features = ["rand_core"] }
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
time = { version = "=0.3.55", features = ["parsing"] }
tokio = { version = "1.48", features = ["macros", "rt-multi-thread", "time", "signal", "fs", "sync", "process", "io-util"] }
tokio-util = { version = "0.7", features = ["rt"] }
webrtc = "=0.17.3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation", "Win32_Security_Cryptography", "Win32_System_Memory",
  "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging", "Win32_UI_Controls", "Win32_UI_Controls_Dialogs", "Win32_UI_Shell",
  "Win32_Graphics_Gdi", "Win32_System_Console", "Win32_UI_HiDpi", "Win32_System_LibraryLoader",
  "Win32_System_DataExchange", "Win32_System_Ole", "Win32_Storage_FileSystem",
  "Win32_Security_Authorization", "Win32_System_SystemServices"
] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

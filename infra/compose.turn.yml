# Run separately on Linux; --project-directory is not needed with this path.
# For TURN TLS/443 use a separate relay IP/host from the API gateway.
name: openremote-turn
services:
  relay:
    image: coturn/coturn:4.19.1-r0
    network_mode: host
    # Match the private files' owning account; never make relay secrets world-readable.
    user: "${TURN_UID:?Run configure_deployment.py}:${TURN_GID:?Run configure_deployment.py}"
    command: ["-c", "/etc/coturn/turnserver.conf"]
    volumes:
      - ../secrets/turnserver.conf:/etc/coturn/turnserver.conf:ro
      - ../secrets/turn-cert.pem:/run/tls/fullchain.pem:ro
      - ../secrets/turn-key.pem:/run/tls/privkey.pem:ro
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp:size=16m,mode=1777]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
